<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Panda">
  <!--
    ORIGINAL ARTWORK, DRAWN FOR THIS WIDGET.

    The client's reference images could not be used: one carries a stock-library
    watermark, which cannot ship on a commercial site. This is vector, so it is
    crisp at 56px in the ball and at 512px anywhere else, weighs ~2 KB, and has
    no licence attached to it.

    To swap in a licensed raster instead, change `logoSrc` in
    components/quick-actions/quickActionsConfig.ts — nothing else reads this file.
  -->
  <defs>
    <clipPath id="pb-disc">
      <circle cx="60" cy="60" r="56" />
    </clipPath>
    <radialGradient id="pb-face" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2EADC" />
    </radialGradient>
  </defs>

  <!-- The cream disc the panda sits on. The ball's own navy and gold ring are
       drawn in CSS around this, so the artwork stays neutral. -->
  <circle cx="60" cy="60" r="56" fill="#FAF6EE" />

  <g clip-path="url(#pb-disc)">
    <!-- Body, cropped by the disc the way the reference crops it. -->
    <ellipse cx="60" cy="110" rx="40" ry="32" fill="#17171A" />
    <ellipse cx="60" cy="114" rx="18" ry="22" fill="#F7F1E6" />

    <!-- Arms. -->
    <ellipse cx="25" cy="100" rx="14" ry="16" fill="#17171A" transform="rotate(18 25 100)" />
    <ellipse cx="95" cy="100" rx="14" ry="16" fill="#17171A" transform="rotate(-18 95 100)" />

    <!-- Ears, behind the head so they read as attached to it. -->
    <circle cx="31" cy="34" r="14" fill="#17171A" />
    <circle cx="89" cy="34" r="14" fill="#17171A" />

    <!-- Head. -->
    <ellipse cx="60" cy="54" rx="37" ry="33" fill="url(#pb-face)" />

    <!-- Eye patches: tilted inward, which is most of what makes it read as cute
         rather than as a bear. -->
    <ellipse cx="43" cy="52" rx="12" ry="14.5" fill="#17171A" transform="rotate(-20 43 52)" />
    <ellipse cx="77" cy="52" rx="12" ry="14.5" fill="#17171A" transform="rotate(20 77 52)" />

    <!-- Eyes. Large, high, and close together — the proportions that carry at
         56px, where fine detail is lost. -->
    <circle cx="45" cy="51" r="5.6" fill="#FFFFFF" />
    <circle cx="75" cy="51" r="5.6" fill="#FFFFFF" />
    <circle cx="45.6" cy="51.6" r="3.6" fill="#17171A" />
    <circle cx="75.6" cy="51.6" r="3.6" fill="#17171A" />
    <circle cx="44" cy="49.6" r="1.5" fill="#FFFFFF" />
    <circle cx="74" cy="49.6" r="1.5" fill="#FFFFFF" />

    <!-- Nose and smile. -->
    <path d="M55 68 q5 -4 10 0 q0 5 -5 6.5 q-5 -1.5 -5 -6.5 z" fill="#17171A" />
    <path
      d="M60 75 q0 4 -5 4 q-3.5 0 -4.5 -2.5 M60 75 q0 4 5 4 q3.5 0 4.5 -2.5"
      fill="none"
      stroke="#17171A"
      stroke-width="2"
      stroke-linecap="round"
    />
  </g>
</svg>
